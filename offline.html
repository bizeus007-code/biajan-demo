<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BİAJAN Yönetim — Apartman ve Site Yönetim Platformu</title>
  <meta name="description" content="Apartman ve site yönetimleri için kolay aidat takibi, gelir-gider yönetimi, banka entegrasyonu, WhatsApp/SMS bilgilendirme ve mobil sakin uygulaması.">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0F172A;
      color: #F8FAFC;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    .card {
      background: #1E293B;
      border: 1px solid #334155;
      padding: 32px;
      border-radius: 16px;
      max-width: 400px;
      width: 100%;
    }
    h1 {
      font-size: 20px;
      margin-bottom: 12px;
      color: #60A5FA;
    }
    p {
      color: #94A3B8;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    button {
      background: #2563EB;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover {
      background: #1D4ED8;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>İnternet Bağlantısı Yok</h1>
    <p>Şu anda çevrimdışısınız. Önceden yüklenmiş verileri görüntüleyebilirsiniz ancak yeni işlem yapabilmek için internet bağlantısı gereklidir.</p>
    <button onclick="window.location.reload()">Tekrar Dene</button>
  </div>
</body>
</html>
